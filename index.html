<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Recicláveis ATR</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b0b;--p:#171717;--g:#b8860b;--g2:#d4a017;--t:#ece4cf;--m:#9a9278}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100vh}
nav{width:270px;flex:none;background:#000;border-right:2px solid var(--g);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;color:var(--g2);font-weight:700;font-size:15px;line-height:1.25;padding:4px 4px 14px;border-bottom:1px solid #2a2a2a;margin-bottom:8px}
.ic{width:42px;height:42px;flex:none;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center;font-size:26px}
nav button{background:transparent;color:var(--t);border:1px solid transparent;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer}
nav button:hover{background:#1a1a1a}nav button.on{background:var(--g);color:#000;font-weight:700}
nav .sep{height:1px;background:#2a2a2a;margin:8px 0}
nav .act{border-color:var(--g);color:var(--g2)}
main{flex:1;padding:24px;min-width:0}
h2{color:var(--g2);margin:0 0 16px;border-bottom:2px solid var(--g);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;background:var(--p);padding:16px;border-radius:10px;border:1px solid #2a2a2a;margin-bottom:20px;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--m)}
input,select,textarea{background:#0b0b0b;color:var(--t);border:1px solid #3a3a3a;border-radius:6px;padding:9px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2)}
button{font-family:inherit;cursor:pointer}
.pri{background:var(--g);color:#000;border:0;font-weight:700;padding:10px 16px;border-radius:6px;font-size:14px}
.pri:hover{background:var(--g2)}
.x{background:#2a1111;color:#f0a0a0;border:1px solid #5a2222;border-radius:6px;padding:6px 10px}
.tw{overflow-x:auto;border:1px solid #2a2a2a;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--g);color:#000;text-align:left;padding:9px}td{padding:9px;border-top:1px solid #262626}
tr:nth-child(even) td{background:#121212}
.ac{white-space:nowrap}.ac button:not(.x){background:#222;color:var(--g2);border:1px solid var(--g);border-radius:6px;padding:6px 10px;margin-right:6px}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.card{background:var(--p);border:1px solid var(--g);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:3px;min-width:150px}
.card b{color:var(--g2)}.card small{color:var(--m)}.m{color:var(--m)}
#m{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9}
#m[hidden],#pa{display:none}
.box{background:var(--p);border:2px solid var(--g);border-radius:12px;padding:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;color:var(--g2)}.box textarea{min-height:160px}
.box>button:not(.pri):not(.x){background:#222;color:var(--t);border:1px solid #444;border-radius:6px;padding:10px}
.rep{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12pt;padding:16px}
.rep h1{font-size:14pt;margin:0 0 4px}.rep h3{font-size:12pt;margin:16px 0 6px;color:#000}
.rep table{font-size:12pt}.rep th{background:#ddd;color:#000;border:1px solid #888}.rep td{border:1px solid #888;background:#fff!important}
#t{position:fixed;bottom:20px;right:20px;background:var(--g2);color:#000;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:10}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--g)}.logo{width:100%}nav .sep{display:none}main{padding:14px}}
@media print{body>*{display:none!important}body>#pa{display:block!important}}
</style></head><body>
<nav><div class="logo"><span class="ic">♻</span><span>GESTÃO DE RECICLÁVEIS ATR</span></div><div id="nv" style="display:contents"></div>
<div class="sep"></div>
<button class="act" data-act="rp">📄 Gerar Relatório PDF</button>
<button class="act" data-act="ex">⬇ Exportar Backup</button>
<button class="act" data-act="im">⬆ Importar Backup</button></nav>
<main id="main"></main><div id="m" hidden></div><div id="pa"></div><div id="t"></div>
<script>
const U=['KG','UND','BAG','CORDA','CX','FD','OUTRO'],K='atr_reciclaveis_v1';
let D={recs:[],parts:[],saidas:[],entradas:[],galpao:[]},cur='recs';
try{const s=localStorage.getItem(K);if(s)Object.assign(D,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const unitOf=r=>r.unidade==='OUTRO'&&r.outra?r.outra.toUpperCase():r.unidade;
const units=()=>[...new Set([...U.filter(u=>u!=='OUTRO'),...D.recs.map(unitOf)])];
const recN=()=>D.recs.map(r=>r.nome),pt=t=>()=>D.parts.filter(p=>p.tipo===t).map(p=>p.nome);
// campo: [chave, rótulo, tipo(t/n/d/s), opções, opcional]
const S={
recs:[['nome','Reciclável','t'],['unidade','Unidade','s',()=>U],['outra','Outra unidade (se OUTRO)','t',0,1]],
parts:[['nome','Nome','t'],['tipo','Tipo','s',()=>['Fornecedor','Comprador']],['contato','Telefone / contato','t',0,1]],
saidas:[['data','Data','d'],['comprador','Comprador','s',pt('Comprador')],['reciclavel','Tipo de reciclável','s',recN],['unidade','Unidade','s',units],['quantidade','Quantidade','n'],['total','Total (R$)','n'],['responsavel','Responsável','t']],
entradas:[['data','Data','d'],['fornecedor','Fornecedor','s',pt('Fornecedor'),1],['reciclavel','Reciclável','s',recN],['unidade','Unidade','s',units],['quantidade','Quantidade','n']],
galpao:[['data','Data','d'],['reciclavel','Reciclável','s',recN],['unidade','Unidade','s',units],['quantidade','Total no galpão','n'],['responsavel','Responsável pela contagem','t']]};
const N=[['recs','Cadastro de Reciclável','crud'],['parts','Fornecedores e Compradores','crud'],['saidas','Registrar Saída','reg'],['entradas','Registrar Entrada','reg'],['tsaidas','Total de Saídas','tot','saidas'],['tentradas','Total de Entradas','tot','entradas'],['galpao','Reciclados no Galpão','crud']];
function formHTML(k,v={}){return S[k].map(([n,l,t,o,opt])=>{const val=v[n]??(t==='d'?today():'');let i;
if(t==='s'){const ops=o();if(val&&!ops.includes(val))ops.push(val);i=`<select name="${n}" ${opt?'':'required'}><option value="">Selecione…</option>${ops.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
else i=`<input name="${n}" type="${t==='n'?'number':t==='d'?'date':'text'}" ${t==='n'?'step="any" min="0"':''} value="${esc(val)}" ${opt?'':'required'}>`;
return `<label>${l}${i}</label>`}).join('')}
function bind(f,k,id,done){
f.onchange=e=>{if(e.target.name==='reciclavel'&&f.elements.unidade){const r=D.recs.find(x=>x.nome===e.target.value);if(r)f.elements.unidade.value=unitOf(r)}};
f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));['quantidade','total'].forEach(c=>{if(c in o)o[c]=+o[c]});
if(id)Object.assign(D[k].find(x=>x.id===id),o);else D[k].push({id:uid(),...o});save();done()}}
const cell=(k,r,n,t)=>t==='d'?fd(r[n]):n==='total'?money(r[n]):esc(k==='recs'&&n==='unidade'?unitOf(r):r[n]);
const cols=k=>S[k].filter(x=>x[0]!=='outra');
const rows=k=>D[k].slice().sort((a,b)=>(b.data||'')<(a.data||'')?-1:1);
function table(k,edit=1,r=rows(k)){const c=cols(k);return `<div class="tw"><table><tr>${c.map(x=>`<th>${x[1]}</th>`).join('')}${edit?'<th></th>':''}</tr>${r.map(o=>`<tr>${c.map(([n,,t])=>`<td>${cell(k,o,n,t)}</td>`).join('')}${edit?`<td class="ac"><button data-e="${k}|${o.id}">Editar</button><button class="x" data-d="${k}|${o.id}">Excluir</button></td>`:''}</tr>`).join('')||`<tr><td colspan="9">Nenhum registro.</td></tr>`}</table></div>`}
function sum(k){const m={};D[k].forEach(r=>{const g=r.reciclavel+'|'+r.unidade;m[g]=m[g]||{n:r.reciclavel,u:r.unidade,q:0,t:0};m[g].q+=+r.quantidade||0;m[g].t+=+r.total||0});return Object.values(m)}
function sumHTML(k){const s=sum(k);return `<div class="cards">${s.map(x=>`<div class="card"><b>${esc(x.n)}</b><span>${x.q.toLocaleString('pt-BR')} ${esc(x.u)}</span>${k==='saidas'?`<small>${money(x.t)}</small>`:''}</div>`).join('')||'<p class="m">Sem registros ainda.</p>'}</div>`}
function go(id){cur=id;const m=N.find(x=>x[0]===id),k=m[3]||id;let h=`<h2>${m[1]}</h2>`;
if(!['recs','parts'].includes(k)&&!D.recs.length)h+='<p class="m">⚠ Cadastre primeiro os recicláveis (e fornecedores/compradores) para poder escolhê-los aqui.</p>';
if(m[2]!=='tot')h+=`<form id="f" class="grid">${formHTML(k)}<button class="pri">Salvar</button></form>`;
else h+=sumHTML(k)+(k==='saidas'?`<p class="m">Total geral recebido: <b style="color:var(--g2)">${money(D.saidas.reduce((a,r)=>a+(+r.total||0),0))}</b></p>`:'');
if(m[2]!=='reg')h+=table(k);
$('#main').innerHTML=h;
$('#nv').innerHTML=N.map(x=>`<button data-go="${x[0]}" class="${x[0]===id?'on':''}">${x[1]}</button>`).join('');
const f=$('#f');if(f)bind(f,k,null,()=>{toast('Salvo!');go(id)})}
function modal(h){$('#m').innerHTML=`<div class="box">${h}</div>`;$('#m').hidden=false}
const closeM=()=>{$('#m').hidden=true;$('#m').innerHTML=''};
function toast(s){const t=$('#t');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function reportHTML(){const sec=(t,k)=>`<h3>${t}</h3>${table(k,0)}`;
return `<h1>Gestão de Recicláveis ATR — Relatório</h1><div>Emitido em ${new Date().toLocaleString('pt-BR')}</div>${sec('Saídas de recicláveis','saidas')}<div>Total geral: <b>${money(D.saidas.reduce((a,r)=>a+(+r.total||0),0))}</b></div>${sec('Entradas de recicláveis','entradas')}${sec('Reciclados no galpão','galpao')}`}
function printRep(){$('#pa').innerHTML=`<div class="rep">${reportHTML()}</div>`;try{window.print()}catch(e){toast('Impressão indisponível aqui. Use Visualizar.')}}
async function exportB(){const data=JSON.stringify({app:'atr-reciclaveis',v:1,em:new Date().toISOString(),dados:D},null,2);let d=null;
try{d=await claude.use('downloads')}catch(e){}
if(d){try{await d.save({filename:'backup-reciclaveis-atr-'+today()+'.json',data});toast('Backup exportado!');return}catch(e){if(e&&e.code==='declined')return}}
modal(`<h3>Copie seu backup</h3><p class="m">O download direto não está disponível. Copie o texto abaixo e salve em um arquivo .txt no seu computador.</p><textarea readonly>${esc(data)}</textarea><button data-act="close">Fechar</button>`)}
function importUI(){modal(`<h3>Importar Backup</h3><p class="m">Escolha o arquivo .json/.txt do backup (ou cole o conteúdo). Isso substitui os dados atuais.</p><input type="file" id="bf" accept=".json,.txt"><textarea id="bt" placeholder="…ou cole o conteúdo do backup aqui"></textarea><button class="pri" data-act="doim">Importar e substituir dados</button><button data-act="close">Cancelar</button>`);
$('#bf').onchange=async e=>{const f=e.target.files[0];if(f)$('#bt').value=await f.text()}}
function doImport(){try{const o=JSON.parse($('#bt').value),d=o.dados||o;if(!Array.isArray(d.recs)&&!Array.isArray(d.saidas))throw 0;
D={recs:[],parts:[],saidas:[],entradas:[],galpao:[]};for(const k in D)if(Array.isArray(d[k]))D[k]=d[k];save();closeM();go(cur);toast('Backup importado!')}catch(e){toast('Arquivo de backup inválido.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
if(b.dataset.go)go(b.dataset.go);
else if(b.dataset.e){const[k,id]=b.dataset.e.split('|');modal(`<h3>Editar registro</h3><form id="ef" class="grid">${formHTML(k,D[k].find(x=>x.id===id))}<button class="pri">Salvar alterações</button><button type="button" class="x" data-act="close">Cancelar</button></form>`);bind($('#ef'),k,id,()=>{closeM();go(cur);toast('Alterado!')})}
else if(b.dataset.d)modal(`<h3>Excluir registro?</h3><p>Esta ação não pode ser desfeita.</p><button class="x" data-del="${b.dataset.d}">Excluir</button><button data-act="close">Cancelar</button>`);
else if(b.dataset.del){const[k,id]=b.dataset.del.split('|');D[k]=D[k].filter(x=>x.id!==id);save();closeM();go(cur)}
else if(a==='close')closeM();
else if(a==='rp')modal(`<h3>Relatório em PDF</h3><p>O que você deseja fazer?</p><button class="pri" data-act="rprint">🖨 Imprimir</button><button data-act="rview">👁 Visualizar</button><button data-act="close">Cancelar</button>`);
else if(a==='rview')modal(`<div class="rep">${reportHTML()}</div><button class="pri" data-act="rprint">🖨 Imprimir / salvar como PDF</button><button data-act="close">Fechar</button>`);
else if(a==='rprint'){closeM();printRep()}
else if(a==='ex')exportB();else if(a==='im')importUI();else if(a==='doim')doImport()});
go('recs');
</script></body></html>
