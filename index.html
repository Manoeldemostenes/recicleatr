<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Recicláveis ATR</title>
<style>
:root{--bg:#0b0b0b;--p:#171717;--p2:#222;--g:#b8860b;--g2:#daa520;--t:#eee;--m:#9a9a9a;--r:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
aside{width:260px;background:#000;border-right:2px solid var(--g);padding:16px;position:fixed;top:0;bottom:0;display:flex;flex-direction:column;gap:6px;overflow:auto}
aside h1{font-size:15px;color:var(--g2);margin:0 0 14px;display:flex;gap:10px;align-items:center;line-height:1.2}aside h1 span{font-size:30px}
aside button,.btn{background:var(--p2);color:var(--t);border:1px solid #333;padding:10px 12px;border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
aside button:hover,aside button.on{background:var(--g);color:#000;border-color:var(--g)}.sep{border-top:1px solid #333;margin:8px 0}
.btn{text-align:center;background:var(--g);color:#000;font-weight:600;border:0}.btn:hover{background:var(--g2)}.btn.s{background:var(--p2);color:var(--t);border:1px solid #444}.btn.d{background:var(--r);color:#fff}
main{margin-left:260px;padding:24px;flex:1;max-width:1100px}h2{color:var(--g2);margin-top:0;border-bottom:1px solid #333;padding-bottom:8px}
.card{background:var(--p);border:1px solid #2a2a2a;border-radius:8px;padding:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}label{font-size:12px;color:var(--m);display:block;margin-bottom:4px}
input,select{width:100%;padding:9px;background:#0d0d0d;color:var(--t);border:1px solid #3a3a3a;border-radius:5px;font-size:14px}input:focus,select:focus{outline:1px solid var(--g2)}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--g);color:#000;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid #2a2a2a}tr:hover td{background:#1d1d1d}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.chip{background:#000;border:1px solid var(--g);border-radius:20px;padding:6px 14px;font-size:13px}.chip b{color:var(--g2)}
#ov{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:9}#ov>div{background:var(--p);border:2px solid var(--g);border-radius:10px;padding:20px;width:min(560px,92vw);max-height:90vh;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#toast{position:fixed;bottom:20px;right:20px;background:var(--g);color:#000;padding:10px 16px;border-radius:6px;display:none;z-index:10;max-width:80vw}pre{background:#000;padding:10px;overflow:auto;font-size:12px;border-radius:6px;color:var(--g2)}
.empty{color:var(--m);padding:14px}@media(max-width:700px){aside{position:static;width:100%}body{flex-direction:column}main{margin:0;padding:12px}}
</style></head><body>
<aside><h1><span>♻️</span>GESTÃO DE RECICLÁVEIS ATR</h1><div id="nav" style="display:flex;flex-direction:column;gap:6px"></div><div class="sep"></div>
<button onclick="relModal()">📄 Relatório em PDF</button><button onclick="exportar()">⬇️ Exportar Backup</button><button onclick="$('#imp').click()">⬆️ Importar Backup</button>
<input type="file" id="imp" accept=".json,.txt" hidden onchange="importar(this.files[0])"><div id="st" style="font-size:12px;color:var(--m);margin-top:auto"></div></aside>
<main id="main"></main><div id="ov"><div id="md"></div></div><div id="toast"></div>
<script>
const UN=['KG','UND','BAG','CORDA','CX','FD'],TB=['reciclaveis','parceiros','saidas','entradas'],$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n||0).toLocaleString('pt-BR'),brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dt=d=>d?d.split('-').reverse().join('/'):'';
let cfg={};try{cfg=JSON.parse(localStorage.getItem('atr_cfg')||'{}')}catch(e){}
const cloud=()=>!!(cfg.url&&cfg.key);let db={reciclaveis:[],parceiros:[],saidas:[],entradas:[]},cur='saidas-novo';
const OPC=['contato','fornecedor'];
const F={reciclaveis:[['nome','Nome do reciclável','text'],['unidade','Unidade','sel']],
parceiros:[['nome','Nome','text'],['tipo','Tipo','sel'],['contato','Contato (opcional)','text']],
saidas:[['data','Data','date'],['comprador','Comprador','sel'],['reciclavel','Tipo de reciclável','sel'],['unidade','Unidade','sel'],['quantidade','Quantidade','number'],['total','Total (R$)','number'],['responsavel','Responsável','text']],
entradas:[['data','Data','date'],['fornecedor','Fornecedor (opcional)','sel'],['reciclavel','Tipo de reciclável','sel'],['unidade','Unidade','sel'],['quantidade','Quantidade','number']]};
const OP={unidade:()=>UN,tipo:()=>['Fornecedor','Comprador'],comprador:()=>db.parceiros.filter(p=>p.tipo=='Comprador').map(p=>p.nome),fornecedor:()=>db.parceiros.filter(p=>p.tipo=='Fornecedor').map(p=>p.nome),reciclavel:()=>db.reciclaveis.map(r=>r.nome)};
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'#c0392b':'';t.style.color=e?'#fff':'';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function api(m,t,b,id){const h={apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',Prefer:'return=representation'};
const u=cfg.url.replace(/\/$/,'')+'/rest/v1/'+t+(id?'?id=eq.'+id:m=='GET'?'?select=*&order=id':'');
const r=await fetch(u,{method:m,headers:h,body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(await r.text());return m=='DELETE'?null:r.json()}
const persist=t=>{if(!cloud())try{localStorage.setItem('atr_'+t,JSON.stringify(db[t]))}catch(e){}};
async function load(){if(cloud()){try{for(const t of TB)db[t]=await api('GET',t)}catch(e){toast('Erro ao ler a nuvem: '+e.message,1)}}
else for(const t of TB){try{db[t]=JSON.parse(localStorage.getItem('atr_'+t)||'[]')}catch(e){db[t]=[]}}
$('#st').textContent=cloud()?'☁️ Conectado à nuvem (Supabase)':'💾 Modo local (sem nuvem)'}
async function add(t,o){if(cloud())o=(await api('POST',t,o))[0];else o.id=Date.now()*1000+Math.floor(Math.random()*1000);db[t].push(o);persist(t)}
async function upd(t,id,o){if(cloud())o=(await api('PATCH',t,o,id))[0];db[t]=db[t].map(r=>String(r.id)==String(id)?{...r,...o}:r);persist(t)}
async function del(t,id){if(cloud())await api('DELETE',t,null,id);db[t]=db[t].filter(r=>String(r.id)!=String(id));persist(t)}
function form(t,v={}){return '<div class="grid">'+F[t].map(([n,l,ty])=>{const x=v[n]??(n=='data'?new Date().toISOString().slice(0,10):'');
if(ty=='sel'){let o=OP[n]();if(x&&!o.includes(x))o=[x,...o];return `<div><label>${l}</label><select id="f_${n}" ${n=='reciclavel'?'onchange="autoUn(this)"':''}><option value="">Selecione</option>${o.map(i=>`<option ${i==x?'selected':''}>${esc(i)}</option>`).join('')}</select></div>`}
return `<div><label>${l}</label><input id="f_${n}" type="${ty}" ${ty=='number'?'step="any" min="0"':''} value="${esc(x)}"></div>`}).join('')+'</div>'}
function autoUn(e){const r=db.reciclaveis.find(r=>r.nome==e.value),u=$('#f_unidade');if(r&&u)u.value=r.unidade}
function ler(t){const o={};for(const[n,l,ty]of F[t]){const v=$('#f_'+n).value.trim();if(!v&&!OPC.includes(n)){toast('Preencha: '+l,1);return null}o[n]=ty=='number'?parseFloat(v):v}return o}
async function novo(t){const o=ler(t);if(!o)return;try{await add(t,o);toast('Salvo com sucesso!');page(cur)}catch(e){toast('Erro: '+e.message,1)}}
function cell(n,v){return n=='data'?dt(v):n=='total'?brl(v):n=='quantidade'?num(v):esc(v)}
function tabela(t,rows){if(!rows.length)return '<div class="empty">Nenhum registro.</div>';
return `<div style="overflow-x:auto"><table><tr>${F[t].map(f=>`<th>${f[1].replace(' (opcional)','')}</th>`).join('')}<th></th></tr>${rows.slice().reverse().map(r=>`<tr>${F[t].map(f=>`<td>${cell(f[0],r[f[0]])}</td>`).join('')}<td style="white-space:nowrap"><button class="btn s" onclick="edit('${t}','${r.id}')">✏️ Editar</button></td></tr>`).join('')}</table></div>`}
function resumo(t){const g={};db[t].forEach(r=>{const k=r.reciclavel+'|'+r.unidade;g[k]=g[k]||{q:0,v:0};g[k].q+=+r.quantidade||0;g[k].v+=+r.total||0});
return '<div class="chips">'+(Object.keys(g).map(k=>{const[a,u]=k.split('|');return `<div class="chip">${esc(a)}: <b>${num(g[k].q)} ${esc(u)}</b>${t=='saidas'?' · '+brl(g[k].v):''}</div>`}).join('')||'<div class="empty">Sem dados.</div>')+'</div>'}
function edit(t,id){const r=db[t].find(r=>String(r.id)==String(id));$('#md').innerHTML=`<h2>Editar registro</h2>${form(t,r)}<div class="row"><button class="btn" onclick="salvarEd('${t}','${id}')">Salvar</button><button class="btn d" onclick="excluir('${t}','${id}')">Excluir</button><button class="btn s" onclick="fechar()">Cancelar</button></div>`;$('#ov').style.display='flex'}
async function salvarEd(t,id){const o=ler(t);if(!o)return;try{await upd(t,id,o);fechar();toast('Atualizado!');page(cur)}catch(e){toast('Erro: '+e.message,1)}}
async function excluir(t,id){if(!confirm('Excluir este registro?'))return;try{await del(t,id);fechar();page(cur)}catch(e){toast('Erro: '+e.message,1)}}
const fechar=()=>$('#ov').style.display='none';
const PG={'saidas-novo':['📤 Registrar Saída'],'entradas-novo':['📥 Registrar Entrada'],saidas:['📊 Total de Saídas'],entradas:['📊 Total de Entradas'],reciclaveis:['♻️ Cadastro de Recicláveis'],parceiros:['🤝 Fornecedores e Compradores'],nuvem:['☁️ Nuvem (Supabase)']};
function page(p){cur=p;$('#nav').innerHTML=Object.entries(PG).map(([k,v])=>`<button class="${k==p?'on':''}" onclick="page('${k}')">${v[0]}</button>`).join('');const m=$('#main');let h=`<h2>${PG[p][0]}</h2>`;
if(p.endsWith('-novo')){const t=p.split('-')[0];h+=`<div class="card">${form(t)}<button class="btn" onclick="novo('${t}')">Salvar</button></div>`}
else if(p=='saidas'||p=='entradas')h+=`<div class="card">${resumo(p)}${tabela(p,db[p])}</div>`;
else if(p=='nuvem')h+=nuvem();
else h+=`<div class="card">${form(p)}<button class="btn" onclick="novo('${p}')">Cadastrar</button></div><div class="card">${tabela(p,db[p])}</div>`;
m.innerHTML=h}
function nuvem(){return `<div class="card"><p>Cole os dados do seu projeto Supabase (Project Settings → API):</p><div class="grid"><div><label>Project URL</label><input id="c_url" value="${esc(cfg.url||'')}" placeholder="https://xxxx.supabase.co"></div><div><label>anon public key</label><input id="c_key" value="${esc(cfg.key||'')}"></div></div>
<button class="btn" onclick="salvarCfg()">Conectar e salvar</button> <button class="btn s" onclick="cfg={};localStorage.removeItem('atr_cfg');load().then(()=>page('nuvem'))">Voltar ao modo local</button></div>
<div class="card"><p>1) Crie uma conta gratuita em supabase.com e um projeto. 2) No <b>SQL Editor</b>, rode o script abaixo uma vez. 3) Cole URL e key acima. Dica: use "Exportar Backup" antes e "Importar Backup" depois para enviar seus dados locais à nuvem.</p><pre>${esc(SQL)}</pre><button class="btn s" onclick="navigator.clipboard.writeText(SQL);toast('SQL copiado!')">Copiar SQL</button>
<p style="color:var(--m);font-size:12px">Atenção: esta política libera leitura/escrita a quem tiver a chave. Para dados sensíveis, adicione login do Supabase depois.</p></div>`}
const SQL=`create table reciclaveis(id bigint generated always as identity primary key, nome text, unidade text);
create table parceiros(id bigint generated always as identity primary key, nome text, tipo text, contato text);
create table saidas(id bigint generated always as identity primary key, data date, comprador text, reciclavel text, unidade text, quantidade numeric, total numeric, responsavel text);
create table entradas(id bigint generated always as identity primary key, data date, fornecedor text, reciclavel text, unidade text, quantidade numeric);
do $$ declare t text; begin foreach t in array array['reciclaveis','parceiros','saidas','entradas'] loop
execute format('alter table %I enable row level security',t);
execute format('create policy "acesso" on %I for all using (true) with check (true)',t); end loop; end $$;`;
async function salvarCfg(){cfg={url:$('#c_url').value.trim(),key:$('#c_key').value.trim()};try{localStorage.setItem('atr_cfg',JSON.stringify(cfg))}catch(e){}await load();page('nuvem');toast(cloud()?'Configuração salva!':'Preencha URL e key',!cloud())}
function exportar(){const b=new Blob([JSON.stringify({versao:1,data:new Date().toISOString(),...db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-reciclaveis-atr-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importar(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!TB.some(t=>Array.isArray(d[t])))throw new Error('Arquivo inválido');
if(!confirm(cloud()?'Os dados do backup serão ADICIONADOS à nuvem. Continuar?':'Os dados atuais serão SUBSTITUÍDOS pelo backup. Continuar?'))return;
for(const t of TB){const rows=d[t]||[];if(cloud()){if(rows.length)await api('POST',t,rows.map(({id,...x})=>x))}else{db[t]=rows;persist(t)}}
await load();page(cur);toast('Backup importado!')}catch(e){toast('Erro ao importar: '+e.message,1)}$('#imp').value=''};r.readAsText(f)}
function relHTML(){const blk=(t,n)=>`<h2>${n}</h2><p>${db[t].map(r=>0).length} registro(s)</p>${rsm(t)}<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:12px"><tr>${F[t].map(f=>`<th style="background:#daa520">${f[1].replace(' (opcional)','')}</th>`).join('')}</tr>${db[t].map(r=>`<tr>${F[t].map(f=>`<td>${cell(f[0],r[f[0]])}</td>`).join('')}</tr>`).join('')}</table>`;
const rsm=t=>{const g={};db[t].forEach(r=>{const k=r.reciclavel+' ('+r.unidade+')';g[k]=(g[k]||0)+(+r.quantidade||0)});return '<ul>'+Object.entries(g).map(([k,v])=>`<li>${esc(k)}: <b>${num(v)}</b></li>`).join('')+'</ul>'};
return `<html><head><meta charset="utf-8"><title>Relatório ATR</title></head><body style="font-family:Arial;padding:20px"><h1>♻️ Gestão de Recicláveis ATR — Relatório</h1><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p>${blk('entradas','Entradas')}${blk('saidas','Saídas')}<p><b>Total vendido: ${brl(db.saidas.reduce((a,r)=>a+(+r.total||0),0))}</b></p></body></html>`}
function relModal(){$('#md').innerHTML=`<h2>Relatório em PDF</h2><p>O que deseja fazer?</p><div class="row"><button class="btn" onclick="rel(1)">🖨️ Imprimir</button><button class="btn" onclick="rel(0)">👁️ Visualizar</button><button class="btn s" onclick="fechar()">Cancelar</button></div><p style="color:var(--m);font-size:12px">Para salvar em PDF, escolha "Salvar como PDF" na janela de impressão.</p>`;$('#ov').style.display='flex'}
function rel(p){fechar();const w=window.open('','_blank');if(!w){toast('Permita pop-ups para ver o relatório',1);return}w.document.write(relHTML());w.document.close();if(p)setTimeout(()=>{w.focus();w.print()},400)}
load().then(()=>page('saidas-novo'));
</script></body></html>
